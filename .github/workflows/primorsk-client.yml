name: Primorsk client build

# Сборка исправленного клиента omp-cef (client.dll, cef.asi, renderer.exe) для Primorsk Online.
# Исправления: обрезка записи кадра по размерам текстуры и буфера + блокировка таблиц браузеров (issue #51).
# 03: снятие предела 100 к/с SA:MP + свой предел fps_limit, частота перерисовки интерфейса ui_fps (cef/config.json).
# 04: crash_diag — 64 байта памяти по каждому регистру и номер модели сущности (CEntity::GetBoundRect).
on:
  workflow_dispatch:
  push:
    branches: [primorsk-fix]
    # Клиент собирается только при правке клиента/общего кода (правки сервера собирает primorsk-server.yml).
    paths:
      - 'src/client/**'
      - 'src/shared/**'
      - 'deps/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'vcpkg.json'
      - '.github/actions/**'
      - '.github/workflows/primorsk-client.yml'
      - '.github/workflows/build-client-reusable.yml'

permissions:
  contents: read

jobs:
  build-client:
    uses: ./.github/workflows/build-client-reusable.yml
    with:
      version: 1.4.0-primorsk6
      cef-version: 148.0.10+g7ee53f5+chromium-148.0.7778.218
      cef-arch: windows32
      build-type: Release
